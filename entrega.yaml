apiVersion: v1
kind: Namespace
metadata:
  name: ns-edwin-pacheco
  labels:
    app: ns-edwin-pacheco
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: config-edwin-pacheco
  namespace: ns-edwin-pacheco
data:
  AMBIENTE: dev

---
apiVersion: v1
kind: Secret
metadata:
  name: secret-edwin-pacheco
  namespace: ns-edwin-pacheco
type: Opaque
stringData:
  API_KEY: OB68b5MwQk6773z3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-edwin-pacheco
  namespace: ns-edwin-pacheco
  labels:
    app: app-edwin-pacheco
spec:
  replicas: 3
  selector:
    matchLabels:
      app: app-edwin-pacheco
  template:
    metadata:
      labels:
        app: app-edwin-pacheco
    spec:
      imagePullSecrets:
        - name: regcred-gh
      containers:
        - name: app-edwin-pacheco
          image: ghcr.io/edwinpa/tarea-final:latest
          imagePullPolicy: Always
          env:
            - name: AMBIENTE
              valueFrom:
                configMapKeyRef:
                  name: config-edwin-pacheco
                  key: AMBIENTE
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: secret-edwin-pacheco
                  key: API_KEY
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: svc-edwin-pacheco
  namespace: ns-edwin-pacheco
  labels:
    app: svc-edwin-pacheco
spec:
  selector:
    app: app-edwin-pacheco
  type: ClusterIP
  ports:
    - name: http
      port: 8081
      targetPort: 3000 
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingres-edwin-pacheco
  namespace: ns-edwin-pacheco
  labels:
    app: ingres-edwin-pacheco
spec:
  ingressClassName: nginx
  rules:
    - host: tarea-final.edwin-pacheco.local
      http:
        paths:
        - pathType: Prefix
          path: /
          backend:
            service:
              name: svc-edwin-pacheco
              port:
                number: 8081
---
