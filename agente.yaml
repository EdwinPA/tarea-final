apiVersion: v1
kind: Pod
spec:
    containers:
      - name: herramientas
        image: alpine:3.23
        command:
          - cat
        tty: true
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "1000m"
            memory: "512Mi"
      - name: node-tool
        image: node:24
        command:
          - cat
        tty: true
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "1000m"
            memory: "512Mi"
      - name: kubectl-tool
        image: alpine/k8s:1.36.1
        command:
          - cat
        tty: true
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "1000m"
            memory: "512Mi"
      - name: buildkit
        image: moby/buildkit:rootless
        command:
          - cat
        tty: true
        env:
          - name: BUILDKITD_FLAGS
            value: "--oci-worker-no-process-sandbox"
        securityContext:
          appArmorProfile:
            type: Unconfined
          seccompProfile:
            type: Unconfined
        volumeMounts:
          - name: regcred-gh
            mountPath: /docker-config/github
            readOnly: true
          - name: regcred-gl
            mountPath: /docker-config/gitlab
            readOnly: true
        resources:
          requests:
            cpu: "1000m"
            memory: "256Mi"
          limits:
            cpu: "1000m"
            memory: "2Gi"
    volumes:
      - name: regcred-gh
        secret:
          secretName: regcred-gh
          items:
            - key: .dockerconfigjson
              path: config.json
      - name: regcred-gl
        secret:
          secretName: regcred-gl
          items:
            - key: .dockerconfigjson
              path: config.json
